      - name: Wait for verified local receipt of part 3
        id: receipt3
        if: always() && steps.part3.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$BAMBI_SNAPSHOT/scripts/desktop-windows-transfer.mjs" wait '${{ steps.part3.outputs.artifact-id }}'
      - name: Recheck shared storage before temporary part 4
        id: space4
        if: always() && steps.transfer.outcome == 'success' && steps.receipt3.outcome == 'success' && fromJSON(steps.transfer.outputs.count) > 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$BAMBI_SNAPSHOT/scripts/desktop-windows-transfer.mjs" check '${{ steps.transfer.outputs.root }}/4' "$BAMBI_REMAINING_ARTIFACT_MIB"
      - name: Upload bounded temporary part 4
        id: part4
        if: always() && steps.space4.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bambi-windows-transfer-${{ github.run_id }}-4
          path: ${{ steps.transfer.outputs.root }}/4/*
          retention-days: 1
