          if-no-files-found: error
      - name: Wait for verified local receipt of part 4
        id: receipt4
        if: always() && steps.part4.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$BAMBI_SNAPSHOT/scripts/desktop-windows-transfer.mjs" wait '${{ steps.part4.outputs.artifact-id }}'
      - name: Recheck shared storage before temporary part 5
        id: space5
