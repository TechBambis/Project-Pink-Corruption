        run: node "$BAMBI_SNAPSHOT/scripts/desktop-windows-transfer.mjs" check '${{ steps.transfer.outputs.root }}/3' "$BAMBI_REMAINING_ARTIFACT_MIB"
      - name: Upload bounded temporary part 3
        id: part3
