        run: node "$BAMBI_SNAPSHOT/scripts/desktop-windows-transfer.mjs" check '${{ steps.transfer.outputs.root }}/5' "$BAMBI_REMAINING_ARTIFACT_MIB"
      - name: Upload bounded temporary part 5
