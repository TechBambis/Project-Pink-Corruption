        run: node "$BAMBI_SNAPSHOT/scripts/desktop-windows-transfer.mjs" wait '${{ steps.part5.outputs.artifact-id }}'
      - name: Recheck shared storage before temporary part 6
        id: space6
        if: always() && steps.transfer.outcome == 'success' && steps.receipt5.outcome == 'success' && fromJSON(steps.transfer.outputs.count) > 6
        env:
