        run: node "$BAMBI_SNAPSHOT/scripts/desktop-windows-transfer.mjs" check '${{ steps.transfer.outputs.root }}/6' "$BAMBI_REMAINING_ARTIFACT_MIB"
      - name: Upload bounded temporary part 6
        id: part6
        if: always() && steps.space6.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
