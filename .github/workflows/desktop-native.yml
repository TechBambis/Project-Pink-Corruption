        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$BAMBI_SNAPSHOT/scripts/desktop-windows-transfer.mjs" wait '${{ steps.part6.outputs.artifact-id }}'
      - name: Recheck shared storage before temporary part 7
