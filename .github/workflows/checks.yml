name: Application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Settings compatibility fixtures use an immutable historical baseline.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run repo:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/build-extension.mjs
      - run: npm run eval:conversation
      - name: Install browser fixture dependencies
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check built app in an isolated browser fixture
        if: matrix.node == 24
        run: npm run test:integration
      - name: Check model onboarding and live setup states
        if: matrix.node == 24
        run: |
          node scripts/model-setup-browser-check.mjs
          node scripts/desktop-audio-browser-check.mjs
      - name: Check settings saves, transfer and presets
        if: matrix.node == 24
        run: npm run test:settings
      - name: Check local player controls and scene playback
        if: matrix.node == 24
        run: |
          node scripts/navigation-browser-check.mjs
          node scripts/react-player-browser-check.mjs
          node scripts/regie-browser-check.mjs
          BAMBI_REGIE_FOCUSED=1 node scripts/regie-browser-check.mjs
          BAMBI_REGIE_STORY=1 node scripts/regie-browser-check.mjs
      - name: Save browser diagnostics on failure
        if: failure() && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-node-${{ matrix.node }}
          retention-days: 1
          path: |
            runtime/high-impact-browser-check.json
            runtime/session-studio-*.png
          if-no-files-found: ignore
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks with verified checksum
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --no-banner .'
