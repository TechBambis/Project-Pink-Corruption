name: Qualify received immutable Windows smoke installer
on:
  workflow_call:
    inputs:
      quota_record:
        type: string
        required: true
      remaining_artifact_mib:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.actor_id == '337824705'
    runs-on: windows-2022
    timeout-minutes: 24
    env:
      BAMBI_QUOTA_RECORD: ${{ inputs.quota_record }}
      BAMBI_REMAINING_ARTIFACT_MIB: ${{ inputs.remaining_artifact_mib }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate preflight and prepare checksum-pinned qualification tools
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BAMBI_QUOTA_RECORD)) { throw 'Missing quota preflight.' }
          if ($env:BAMBI_REMAINING_ARTIFACT_MIB -notmatch '^\d+$' -or [long]$env:BAMBI_REMAINING_ARTIFACT_MIB -gt 10) { throw 'Evidence-only storage allowance must be at most 10 MiB.' }
          $pin = (Get-Content config/desktop-windows-runtime.json -Raw | ConvertFrom-Json).node
          $zip = Join-Path $env:RUNNER_TEMP $pin.file
          Invoke-WebRequest -Uri $pin.url -OutFile $zip
          if ((Get-Item $zip).Length -ne $pin.bytes -or (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Pinned Node archive mismatch.' }
          $tools = Join-Path $env:RUNNER_TEMP 'qualification-tools'
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          $node = Join-Path $tools 'node-v24.18.1-win-x64/node.exe'
          'BAMBI_QUALIFICATION_NODE='+$node | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'BAMBI_WINDOWS_TEST_OUTPUT='+(Join-Path $env:RUNNER_TEMP 'Bambi Windows qualification') | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'BAMBI_RECEIVED_PACKAGE='+(Join-Path $env:RUNNER_TEMP 'received-smoke-5') | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'BAMBI_QUALIFICATION_EVIDENCE='+(Join-Path $env:RUNNER_TEMP 'qualification-evidence') | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PATH = (Split-Path $node)+[IO.Path]::PathSeparator+$env:PATH
          & $node (Join-Path (Split-Path $node) 'node_modules/npm/bin/npm-cli.js') ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $observer = Join-Path $env:RUNNER_TEMP 'bambi-qualification-observer.exe'
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $csc /nologo /target:exe /platform:x64 /optimize+ ('/out:'+$observer) (Join-Path $PWD 'scripts/desktop-windows-observer.cs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'BAMBI_WINDOWS_OBSERVER='+$observer | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Receive exact existing private package and verify every retained hash
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = (& gh api repos/TechBambis/Project-Pink-Corruption/actions/artifacts/11505529283 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($artifact.expired -or $artifact.name -ne 'bambi-windows-0.1.0-smoke.5' -or $artifact.workflow_run.id -ne 37672497878 -or $artifact.workflow_run.head_sha -ne 'baf090d55054030bc64d432c2c501502755281c6' -or $artifact.digest -ne 'sha256:09d7fd920b464d6a779cc765adf4d9aaebab70f0042a4e217a1018f7fcbb14d2') { throw 'Received artifact identity mismatch.' }
          & gh run download 37672497878 --repo TechBambis/Project-Pink-Corruption --name bambi-windows-0.1.0-smoke.5 --dir $env:BAMBI_RECEIVED_PACKAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sums = @(Get-Content (Join-Path $env:BAMBI_RECEIVED_PACKAGE 'SHA256SUMS'))
          if ($sums.Count -ne 7 -or @(Get-ChildItem $env:BAMBI_RECEIVED_PACKAGE -File).Count -ne 8) { throw 'Unexpected retained package file count.' }
          foreach ($line in $sums) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid received checksum entry.' }
            if ((Get-FileHash (Join-Path $env:BAMBI_RECEIVED_PACKAGE $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) { throw 'Received file checksum mismatch.' }
          }
      - name: Install and qualify the received binary without rebuilding it
        timeout-minutes: 16
        shell: pwsh
        run: |
          & $env:BAMBI_QUALIFICATION_NODE scripts/desktop-windows-install-check.mjs $env:BAMBI_RECEIVED_PACKAGE --received-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect only qualification reports and corresponding checker source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:BAMBI_QUALIFICATION_EVIDENCE -Force | Out-Null
          $installer = Join-Path $env:BAMBI_RECEIVED_PACKAGE 'QUALIFIED-INSTALLER-CHECK.json'
          if (Test-Path $installer) { Copy-Item $installer $env:BAMBI_QUALIFICATION_EVIDENCE }
          if (Test-Path $env:BAMBI_WINDOWS_TEST_OUTPUT) {
            $runs = @(Get-ChildItem $env:BAMBI_WINDOWS_TEST_OUTPUT -Directory)
            if ($runs.Count -ne 1) { throw 'Expected exactly one application check.' }
            Copy-Item (Join-Path $runs[0].FullName 'evidence.json') (Join-Path $env:BAMBI_QUALIFICATION_EVIDENCE 'QUALIFIED-WINDOWS-PACKAGING-CHECK.json')
          }
          & git archive --format=tar.gz -o (Join-Path $env:BAMBI_QUALIFICATION_EVIDENCE 'QUALIFICATION-SOURCE.tar.gz') HEAD scripts/desktop-windows-check.mjs scripts/desktop-windows-install-check.mjs scripts/desktop-windows-processes.mjs scripts/desktop-windows-support.mjs scripts/desktop-windows-observer.cs config/desktop-windows-runtime.json package.json package-lock.json .github/workflows/cla.yml .github/workflows/desktop-windows-qualify.yml LICENSE LICENSING.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = @{qualificationGitSha=$env:GITHUB_SHA; qualificationRunId=$env:GITHUB_RUN_ID; buildGitSha='baf090d55054030bc64d432c2c501502755281c6'; buildRunId=37672497878; receivedArtifactId=11505529283; version='0.1.0-smoke.5'; rebuilt=$false; quotaRecord=$env:BAMBI_QUOTA_RECORD}
          $report | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:BAMBI_QUALIFICATION_EVIDENCE 'QUALIFICATION-RUN.json') -Encoding utf8NoBOM
          $sums = Get-ChildItem $env:BAMBI_QUALIFICATION_EVIDENCE -File | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllText((Join-Path $env:BAMBI_QUALIFICATION_EVIDENCE 'QUALIFICATION-SHA256SUMS'), ($sums -join "`n")+"`n", [Text.UTF8Encoding]::new($false))
      - name: Enforce small evidence-only upload allowance
        id: storage
        if: always()
        shell: pwsh
        run: |
          $total = (Get-ChildItem $env:BAMBI_QUALIFICATION_EVIDENCE -File | Measure-Object -Property Length -Sum).Sum
          if (!$total -or $total -gt ([long]$env:BAMBI_REMAINING_ARTIFACT_MIB * 1MB * 0.95)) { throw 'Evidence exceeds the checked remaining free storage. No upload.' }
      - name: Retain private qualification evidence only
        if: always() && steps.storage.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bambi-windows-qualification-${{ github.run_id }}
          path: ${{ env.BAMBI_QUALIFICATION_EVIDENCE }}/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
