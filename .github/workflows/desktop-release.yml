name: Verify received Alpha 41 on Ubuntu
on:
  workflow_dispatch:
permissions:
  # GitHub requires write-level repository access to read unpublished assets.
  # The token is used only to download this immutable asset ID.
  contents: write
jobs:
  received-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check authorized account and public repository
        env:
          ACTOR_ID: ${{ github.actor_id }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: test "$ACTOR_ID" = 337824705 && test "$REPO_PRIVATE" = false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e18bb5694a94057895c9e0c61badf50ff87de23b
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.1
      - run: npm ci --ignore-scripts
      - run: npx playwright install-deps chromium
      - name: Receive and verify exact draft asset
        id: receive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/received-alpha41" "$RUNNER_TEMP/alpha41-diagnostics"
          uname -a > "$RUNNER_TEMP/alpha41-diagnostics/host.txt"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/639602492" > "$RUNNER_TEMP/received-alpha41/bambi-local-0.1.0-alpha.41-x86_64.AppImage"
          cd "$RUNNER_TEMP/received-alpha41"
          echo 'eea9ff12aa67590697494c179b7531b91722b68d7178703f4b096163b961c391  bambi-local-0.1.0-alpha.41-x86_64.AppImage' | sha256sum --check
          chmod +x bambi-local-0.1.0-alpha.41-x86_64.AppImage
          ./bambi-local-0.1.0-alpha.41-x86_64.AppImage --appimage-extract > "$RUNNER_TEMP/alpha41-diagnostics/extract.log"
          cat squashfs-root/resources/notices/RUNTIME-MANIFEST.json > "$RUNNER_TEMP/alpha41-diagnostics/runtime.json"
          uname -a > "$RUNNER_TEMP/alpha41-diagnostics/host.txt"
          cat /etc/os-release >> "$RUNNER_TEMP/alpha41-diagnostics/host.txt"
          sysctl kernel.apparmor_restrict_unprivileged_userns >> "$RUNNER_TEMP/alpha41-diagnostics/host.txt" || true
          ls -l squashfs-root/chrome-sandbox >> "$RUNNER_TEMP/alpha41-diagnostics/host.txt"
      - name: Verify finished package and normal sandboxed startup
        id: portable
        env:
          BAMBI_SMOKE_OUTPUT: ${{ runner.temp }}/alpha41-diagnostics
          DEBUG: pw:browser*
        run: |
          set -o pipefail
          xvfb-run -a node scripts/desktop-alpha-check.mjs "$RUNNER_TEMP/received-alpha41/squashfs-root/AppRun" 2>&1 | tee "$RUNNER_TEMP/alpha41-diagnostics/acceptance.log"
      - name: Verify normal root-owned installation with Chromium SUID sandbox
        if: failure() && steps.receive.outcome == 'success'
        id: installed
        env:
          BAMBI_SMOKE_OUTPUT: ${{ runner.temp }}/alpha41-diagnostics
          DEBUG: pw:browser*
        run: |
          set -o pipefail
          test ! -e /opt/bambi-local-alpha41
          sudo cp -a "$RUNNER_TEMP/received-alpha41/squashfs-root" /opt/bambi-local-alpha41
          sudo chown -R root:root /opt/bambi-local-alpha41
          sudo chmod -R a+rX,go-w /opt/bambi-local-alpha41
          sudo chmod 4755 /opt/bambi-local-alpha41/chrome-sandbox
          xvfb-run -a node scripts/desktop-alpha-check.mjs /opt/bambi-local-alpha41/AppRun 2>&1 | tee "$RUNNER_TEMP/alpha41-diagnostics/installed-acceptance.log"
      - name: Build and verify Ubuntu Debian installer from the received package
        if: always() && steps.installed.outcome == 'success'
        id: deb
        env:
          BAMBI_SMOKE_OUTPUT: ${{ runner.temp }}/alpha41-diagnostics
          DEBUG: pw:browser*
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          deb_root="$RUNNER_TEMP/alpha41-deb-root"
          deb_file="$RUNNER_TEMP/bambi-local-0.1.0-alpha.41-linux-amd64.deb"
          mkdir -p "$deb_root/opt" "$deb_root/DEBIAN" "$deb_root/usr/share/applications" "$deb_root/usr/share/icons/hicolor/512x512/apps"
          sudo mv /opt/bambi-local-alpha41 "$deb_root/opt/bambi-local-alpha41"
          cat > "$deb_root/DEBIAN/control" <<'CONTROL'
          Package: bambi-local
          Version: 0.1.0~alpha.41
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: BambiOS <337824705+BambiOS@users.noreply.github.com>
          Depends: libc6 (>= 2.35), libstdc++6, libnss3, libgtk-3-0t64 | libgtk-3-0, libasound2t64 | libasound2, libgbm1, libdrm2, libx11-6, libxkbcommon0, libxcomposite1, libxdamage1, libxrandr2, libcups2t64 | libcups2, libatk1.0-0t64 | libatk1.0-0, libatk-bridge2.0-0t64 | libatk-bridge2.0-0, libpango-1.0-0, libcairo2, libudev1
          Homepage: https://github.com/TechBambis/Project-Pink-Corruption
          Description: Bambi Local chat, voice and media alpha
           Includes the local runtime and Chromium sandbox. AI model downloads
           remain an explicit in-app setup choice.
          CONTROL
          cat > "$deb_root/usr/share/applications/bambi-local.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Bambi Local
          Exec=/opt/bambi-local-alpha41/AppRun %U
          Terminal=false
          Type=Application
          Icon=bambi-local
          StartupWMClass=Bambi Local
          Comment=Local chat, voice and media
          Categories=AudioVideo;
          DESKTOP
          cp "$deb_root/opt/bambi-local-alpha41/bambi-local.png" "$deb_root/usr/share/icons/hicolor/512x512/apps/bambi-local.png"
          dpkg-deb --build --root-owner-group -Zxz -z6 --threads-max=2 "$deb_root" "$deb_file"
          test "$(stat -c %s "$deb_file")" -lt 2147483648
          sudo dpkg --install "$deb_file"
          test "$(stat -c '%U:%G:%a' /opt/bambi-local-alpha41/chrome-sandbox)" = root:root:4755
          xvfb-run -a node scripts/desktop-alpha-check.mjs /opt/bambi-local-alpha41/AppRun 2>&1 | tee "$RUNNER_TEMP/alpha41-diagnostics/deb-acceptance.log"
          sha256sum "$deb_file" > "$RUNNER_TEMP/alpha41-diagnostics/deb-sha256.txt"
          dpkg-deb --info "$deb_file" > "$RUNNER_TEMP/alpha41-diagnostics/deb-info.txt"
          gh release upload v0.1.0-alpha.41 "$deb_file" --repo "$GITHUB_REPOSITORY" --verify-tag
      - name: Upload bounded diagnostics and exercise Artifact v7 archive contract
        if: always()
        id: diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: alpha41-ubuntu-diagnostics
          path: |
            ${{ runner.temp }}/alpha41-diagnostics/*.json
            ${{ runner.temp }}/alpha41-diagnostics/*.txt
            ${{ runner.temp }}/alpha41-diagnostics/*.log
            ${{ runner.temp }}/alpha41-diagnostics/*/evidence.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Record Artifact v7 outputs
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.diagnostics.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.diagnostics.outputs.artifact-digest }}
        run: test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_DIGEST" && printf 'Artifact ID %s SHA256 %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
