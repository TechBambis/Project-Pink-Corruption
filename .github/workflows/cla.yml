name: CLA verification

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to recheck
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted default-branch files, including on fork PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check recorded maintainer verification
        run: node scripts/cla-check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLA_PR_NUMBER: ${{ inputs.pr }}
