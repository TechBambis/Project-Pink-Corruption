# Build-branch entry point only. The default branch CLA workflow is preserved.
# An existing default-branch dispatch path is required by GitHub; this branch
# delegates its authorized manual Windows build to the prepared workflow.
name: Manual Windows desktop build entry point
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [build, qualify, runtime-slice]
        default: build
      phase:
        type: choice
        options: [smoke, alpha]
        default: smoke
      version:
        type: string
        required: true
        default: 0.1.0-smoke.5
      quota_checked:
        type: boolean
        default: false
      quota_record:
        type: string
        required: true
      upload_packages:
        type: boolean
        default: false
      transfer_packages:
        description: Receive bounded private alpha parts locally before removing each temporary part
        type: boolean
        default: false
      remaining_artifact_mib:
        type: string
        default: '0'
permissions:
  contents: read
  actions: read
jobs:
  windows:
    if: inputs.mode == 'build' && inputs.quota_checked && github.actor_id == '337824705'
    uses: ./.github/workflows/desktop-windows.yml
    with:
      phase: ${{ inputs.phase }}
      version: ${{ inputs.version }}
      quota_checked: ${{ inputs.quota_checked }}
      quota_record: ${{ inputs.quota_record }}
      upload_packages: ${{ inputs.upload_packages }}
      transfer_packages: ${{ inputs.transfer_packages }}
      remaining_artifact_mib: ${{ inputs.remaining_artifact_mib }}
  qualification:
    if: inputs.mode == 'qualify' && inputs.quota_checked && github.actor_id == '337824705'
    uses: ./.github/workflows/desktop-windows-qualify.yml
    with:
      quota_record: ${{ inputs.quota_record }}
      remaining_artifact_mib: ${{ inputs.remaining_artifact_mib }}
  runtime-slice:
    if: inputs.mode == 'runtime-slice' && inputs.quota_checked && github.actor_id == '337824705'
    uses: ./.github/workflows/desktop-windows-runtime-slice.yml
    with:
      quota_record: ${{ inputs.quota_record }}
      remaining_artifact_mib: ${{ inputs.remaining_artifact_mib }}
