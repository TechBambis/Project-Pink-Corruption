          & $node scripts/desktop-windows-transfer.mjs check '${{ steps.transfer.outputs.root }}/1' $env:BAMBI_REMAINING_ARTIFACT_MIB
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload bounded temporary part 1
        id: part1
