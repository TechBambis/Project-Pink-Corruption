name: Native Windows speech and runtime slice
on:
  workflow_call:
    inputs:
      quota_record:
        type: string
        required: true
      remaining_artifact_mib:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.actor_id == '337824705'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      BAMBI_QUOTA_RECORD: ${{ inputs.quota_record }}
      BAMBI_REMAINING_ARTIFACT_MIB: ${{ inputs.remaining_artifact_mib }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate bounded free-quota preflight
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BAMBI_QUOTA_RECORD)) { throw 'Missing account/quota evidence.' }
          if ($env:BAMBI_REMAINING_ARTIFACT_MIB -notmatch '^\d+$' -or [int]$env:BAMBI_REMAINING_ARTIFACT_MIB -lt 3) { throw 'Insufficient recorded evidence allowance.' }
          'BAMBI_WINDOWS_SLICE_OUTPUT='+ (Join-Path $env:RUNNER_TEMP 'Public native slice evidence') | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and run target-native speech and runtime slice
        shell: pwsh
        run: |
          & .\scripts\desktop-windows-build.cmd runtime-slice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bound public fixture evidence before retaining it
        id: evidence
        if: always()
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath $env:BAMBI_WINDOWS_SLICE_OUTPUT)) { throw 'No slice evidence produced.' }
          $allowed = @('RUNTIME-SLICE-CHECK.json','WINDOWS-DLL-IMPORTS.json','NATIVE-RUNTIME-INVENTORY.json')
          $files = @(Get-ChildItem -LiteralPath $env:BAMBI_WINDOWS_SLICE_OUTPUT -File)
          if (@($files | Where-Object { $_.Name -notin $allowed }).Count -gt 0) { throw 'Unexpected file in public-fixture evidence.' }
          $total = ($files | Measure-Object Length -Sum).Sum
          if ($total -gt ([Math]::Min(3,[int]$env:BAMBI_REMAINING_ARTIFACT_MIB) * 1MB * 0.95)) { throw 'Evidence exceeds confirmed shared allowance.' }
          $sums = $files | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllText((Join-Path $env:BAMBI_WINDOWS_SLICE_OUTPUT 'SHA256SUMS'), ($sums -join "`n")+"`n", [Text.UTF8Encoding]::new($false))
      - name: Retain only bounded private native evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bambi-windows-runtime-slice-${{ github.run_id }}
          path: ${{ env.BAMBI_WINDOWS_SLICE_OUTPUT }}/*
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
